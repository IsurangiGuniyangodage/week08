# Prometheus and Grafana configuration for the SIT722 HD progressive delivery demo.

grafana:
  enabled: true

  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: ClusterIP

  defaultDashboardsEnabled: true

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring


prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 15s
    evaluationInterval: 15s

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    additionalScrapeConfigs:
      - job_name: koalatech-hd-canary

        metrics_path: /probe

        params:
          module:
            - http_2xx

        static_configs:

          # ---------------------------------------------------------
          # HD demonstration environment
          # ---------------------------------------------------------
          - targets:
              - http://user-service-canary.hd-demo.svc.cluster.local:8000/canary-check
            labels:
              environment: hd-demo
              service: user-service-canary

          # ---------------------------------------------------------
          # Production progressive delivery environment
          # ---------------------------------------------------------
          - targets:
              - http://user-service-canary.production.svc.cluster.local:8000/canary-check
            labels:
              environment: production
              service: user-service-canary

        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target

          - source_labels: [__param_target]
            target_label: instance

          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115


# These AKS control-plane endpoints are managed by Azure
# and are not directly exposed to Prometheus.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false