name: 04 - Deploy to Production

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production-week08
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    defaults:
      run:
        shell: bash

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}

    steps:
      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full Git commit SHA."
            exit 1
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      # ---------------------------------------------------------
      # Verify that the HD progressive delivery extension exists
      # ---------------------------------------------------------
      - name: Verify Argo Rollouts installation
        run: |
          kubectl get crd rollouts.argoproj.io
          kubectl get deployment argo-rollouts \
            --namespace argo-rollouts

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application and database secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEFAULT_ADMIN_USERNAME: ${{ secrets.DEFAULT_ADMIN_USERNAME }}
          DEFAULT_ADMIN_EMAIL: ${{ secrets.DEFAULT_ADMIN_EMAIL }}
          DEFAULT_ADMIN_PASSWORD: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}
        run: |
          for name in POSTGRES_USER POSTGRES_PASSWORD JWT_SECRET_KEY \
            DEFAULT_ADMIN_USERNAME DEFAULT_ADMIN_EMAIL DEFAULT_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

          STORAGE_CONNECTION_STRING=$(az storage account show-connection-string \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name ishuaraw08sa9381 \
            --query connectionString \
            -o tsv)

          if [ -z "$STORAGE_CONNECTION_STRING" ]; then
            echo "Unable to obtain the storage connection string."
            exit 1
          fi

          echo "::add-mask::$STORAGE_CONNECTION_STRING"

          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=DEFAULT_ADMIN_USERNAME="$DEFAULT_ADMIN_USERNAME" \
            --from-literal=DEFAULT_ADMIN_EMAIL="$DEFAULT_ADMIN_EMAIL" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="$DEFAULT_ADMIN_PASSWORD" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="$STORAGE_CONNECTION_STRING" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # The original Week 9 implementation used a Deployment for
      # user-service. The HD extension replaces it with an Argo Rollout.
      - name: Remove legacy user-service Deployment
        run: |
          kubectl delete deployment user-service \
            --namespace production \
            --ignore-not-found=true

      - name: Apply production manifests with tested images
        run: |
          mkdir -p "$RUNNER_TEMP/production-manifests"

          for manifest in kubernetes/production/*.yaml; do
            cp "$manifest" "$RUNNER_TEMP/production-manifests/"
          done

          for service in frontend user-service student-service lecturer-service \
            course-service enrollment-service; do

            manifest=$(find "$RUNNER_TEMP/production-manifests" \
              -name "*-${service}.yaml" -print -quit)

            test -n "$manifest"

            sed -i \
              "s|image: placeholder|image: ${ACR_LOGIN_SERVER}/koalatech-${service}:${IMAGE_TAG}|g" \
              "$manifest"
          done

          kubectl apply -f "$RUNNER_TEMP/production-manifests/"

      # ---------------------------------------------------------
      # Existing Kubernetes Deployment behaviour
      # ---------------------------------------------------------
      - name: Wait for standard production deployments
        run: |
          for service in frontend student-service lecturer-service \
            course-service enrollment-service; do

            kubectl rollout status deployment/"$service" \
              --namespace production \
              --timeout=600s
          done

      # ---------------------------------------------------------
      # HD extension - Argo Rollouts CLI
      # ---------------------------------------------------------
      - name: Install Argo Rollouts CLI
        run: |
          curl -LO \
            https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64

          chmod +x kubectl-argo-rollouts-linux-amd64

          sudo mv \
            kubectl-argo-rollouts-linux-amd64 \
            /usr/local/bin/kubectl-argo-rollouts

          kubectl argo rollouts version

      # ---------------------------------------------------------
      # HD extension - wait for Prometheus-controlled rollout
      #
      # Argo will progress:
      # 20% -> Prometheus analysis -> 50%
      # -> Prometheus analysis -> 100%
      #
      # A failed analysis causes the rollout to abort.
      # ---------------------------------------------------------
      - name: Wait for progressive user-service rollout
        run: |
          kubectl argo rollouts status user-service \
            --namespace production \
            --timeout 10m

      # Run even when progressive delivery fails so that the
      # workflow records evidence of the AnalysisRun and rollout.
      - name: Show progressive deployment evidence
        if: always()
        run: |
          echo "=== User-service Rollout ==="
          kubectl get rollout user-service \
            --namespace production || true

          echo ""
          echo "=== Prometheus Analysis Runs ==="
          kubectl get analysisrun \
            --namespace production || true

          echo ""
          echo "=== User-service ReplicaSets ==="
          kubectl get replicaset \
            --namespace production \
            -l app=user-service || true

          echo ""
          echo "=== User-service Pods ==="
          kubectl get pods \
            --namespace production \
            -l app=user-service \
            -o wide || true

      - name: Show production resources
        if: always()
        run: |
          kubectl get pods --namespace production || true
          kubectl get services --namespace production || true
          kubectl get pvc --namespace production || true

      - name: Add production summary
        if: success()
        run: |
          {
            echo "### Production deployment"
            echo "- Deployed tested image tag: $IMAGE_TAG"
            echo "- Five services used standard Kubernetes Deployments."
            echo "- user-service used Argo Rollouts progressive canary delivery."
            echo "- Prometheus analysis controlled automatic promotion or rejection."
          } >> "$GITHUB_STEP_SUMMARY"