apiVersion: v1
kind: Service
metadata:
  name: user-service-stable
  namespace: hd-demo
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: user-service-canary
  namespace: hd-demo
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000