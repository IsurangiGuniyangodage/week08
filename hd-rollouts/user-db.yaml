apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-db-pvc
  namespace: hd-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: hd-demo
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: user-db

  template:
    metadata:
      labels:
        app: user-db

    spec:
      containers:
        - name: user-db
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: users

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d users
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: user-db-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: user-db-storage
          persistentVolumeClaim:
            claimName: user-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: hd-demo
spec:
  type: ClusterIP

  selector:
    app: user-db

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432