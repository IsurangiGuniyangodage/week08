apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: user-service
  namespace: hd-demo

spec:
  replicas: 5

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      initContainers:
        - name: wait-for-user-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h user-db -p 5432 -U postgres -d users;
              do
                echo "Waiting for user database..."
                sleep 3
              done

      containers:
        - name: user-service
          image: ishuaraweek08acr9381.azurecr.io/koalatech-user-service:v3-bad
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: users

            - name: POSTGRES_HOST
              value: user-db

            - name: POSTGRES_PORT
              value: "5432"

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: JWT_SECRET_KEY

            - name: JWT_ALGORITHM
              value: HS256

            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"

            - name: DEFAULT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: DEFAULT_ADMIN_USERNAME

            - name: DEFAULT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: DEFAULT_ADMIN_EMAIL

            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hd-demo-secret
                  key: DEFAULT_ADMIN_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

  strategy:
    canary:
      stableService: user-service-stable
      canaryService: user-service-canary

      maxSurge: 1
      maxUnavailable: 0

      steps:
        - setWeight: 20

        - pause:
            duration: 30s

        - analysis:
            templates:
              - templateName: canary-health-check

        - setWeight: 50

        - pause:
            duration: 30s

        - analysis:
            templates:
              - templateName: canary-health-check

        - setWeight: 100